<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Notes</title>
  <style>
    :root {
      --bg-gradient-start: #667eea;
      --bg-gradient-end: #764ba2;
      --container-bg: #ffffff;
      --text-color: #333333;
      --textarea-bg: #ffffff;
      --textarea-border: #e0e0e0;
      --textarea-focus: #667eea;
      --button-bg: #667eea;
      --button-hover: #5568d3;
      --info-bg: #f8f9fa;
      --info-text: #666666;
      --status-text: #666666;
    }

    body.dark-mode {
      --bg-gradient-start: #1a1a2e;
      --bg-gradient-end: #16213e;
      --container-bg: #0f3460;
      --text-color: #e0e0e0;
      --textarea-bg: #1a1a2e;
      --textarea-border: #2a2a4e;
      --textarea-focus: #667eea;
      --button-bg: #667eea;
      --button-hover: #5568d3;
      --info-bg: #1a1a2e;
      --info-text: #a0a0a0;
      --status-text: #a0a0a0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.3s ease;
    }

    .container {
      background: var(--container-bg);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 800px;
      padding: 30px;
      transition: background 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--text-color);
      font-size: 28px;
      margin: 0;
      transition: color 0.3s ease;
    }

    .theme-toggle {
      background: transparent;
      border: 2px solid var(--button-bg);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      background: var(--button-bg);
      transform: rotate(20deg);
    }

    textarea {
      width: 100%;
      min-height: 400px;
      padding: 15px;
      background: var(--textarea-bg);
      color: var(--text-color);
      border: 2px solid var(--textarea-border);
      border-radius: 8px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--textarea-focus);
    }

    .button-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background: var(--button-bg);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .status {
      color: var(--status-text);
      font-size: 14px;
      margin-left: auto;
      transition: color 0.3s ease;
    }

    .status.saving {
      color: #f39c12;
    }

    .status.saved {
      color: #27ae60;
    }

    .status.error {
      color: #e74c3c;
    }

    .info {
      margin-top: 15px;
      padding: 10px;
      background: var(--info-bg);
      border-radius: 6px;
      font-size: 14px;
      color: var(--info-text);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Simple Notes</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    </div>
    <textarea id="notepad" placeholder="Start typing your notes here..."></textarea>
    <div class="button-container">
      <button onclick="saveNotes()">Save Notes</button>
      <span class="status" id="status"></span>
    </div>
    <div class="info">
      💡 Your notes are shared across all users and persist on the server.
    </div>
  </div>

  <script>
    const notepad = document.getElementById('notepad');
    const status = document.getElementById('status');
    const themeToggle = document.querySelector('.theme-toggle');

    // Initialize theme from localStorage
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
      }
    }

    // Toggle theme
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Load notes on page load
    async function loadNotes() {
      try {
        const response = await fetch('/api/notes');
        const data = await response.json();
        notepad.value = data.content || '';
        if (data.lastUpdated) {
          status.textContent = `Last updated: ${new Date(data.lastUpdated).toLocaleString()}`;
          status.className = 'status';
        }
      } catch (error) {
        console.error('Error loading notes:', error);
        status.textContent = 'Error loading notes';
        status.className = 'status error';
      }
    }

    // Save notes
    async function saveNotes() {
      status.textContent = 'Saving...';
      status.className = 'status saving';

      try {
        const response = await fetch('/api/notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ content: notepad.value }),
        });

        const data = await response.json();
        
        if (data.success) {
          status.textContent = 'Saved successfully! ✓';
          status.className = 'status saved';
          setTimeout(() => {
            status.textContent = `Last updated: ${new Date().toLocaleString()}`;
            status.className = 'status';
          }, 2000);
        } else {
          throw new Error('Save failed');
        }
      } catch (error) {
        console.error('Error saving notes:', error);
        status.textContent = 'Error saving notes ✗';
        status.className = 'status error';
      }
    }

    // Auto-save every 30 seconds
    setInterval(saveNotes, 30000);

    // Initialize theme and load notes when page loads
    initTheme();
    loadNotes();

    // Keyboard shortcut: Ctrl+S or Cmd+S to save
    notepad.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveNotes();
      }
    });
  </script>
</body>
</html>
